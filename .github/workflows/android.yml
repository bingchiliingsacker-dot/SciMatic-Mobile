name: Build SciMatic Mobile (Android)

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Android (${{ matrix.target }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
            api_level: 24
            clang_prefix: aarch64-linux-android

          - target: x86_64-linux-android
            api_level: 24
            clang_prefix: x86_64-linux-android

    env:
      ANDROID_API_LEVEL: ${{ matrix.api_level }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;26.1.10909125"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Maturin
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin

      - name: Configure Android linker
        shell: bash
        run: |
          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"

          LINKER_VAR="CARGO_TARGET_$(echo '${{ matrix.target }}' | tr '[:lower:]-' '[:upper:]_')_LINKER"

          LINKER="$TOOLCHAIN/${{ matrix.clang_prefix }}${{ matrix.api_level }}-clang"

          if [ ! -x "$LINKER" ]; then
            echo "Android linker not found:"
            echo "$LINKER"
            exit 1
          fi

          echo "$LINKER_VAR=$LINKER" >> "$GITHUB_ENV"

          echo "Using Android API level: $ANDROID_API_LEVEL"
          echo "Using linker: $LINKER"

      - name: Build Android wheel
        run: |
          maturin build \
            --release \
            --target "${{ matrix.target }}"

      - name: Upload Android wheel
        uses: actions/upload-artifact@v4
        with:
          name: scimatic-android-${{ matrix.target }}
          path: target/wheels/*.whl
          if-no-files-found: error